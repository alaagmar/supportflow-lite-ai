services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile.dev
      args:
        PHP_IMAGE: ${PHP_IMAGE}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE}
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  api-nginx:
    volumes:
      - ./infra/nginx/api.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/var/www/html/public:ro
    ports:
      - "8080:80"

  worker:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile.dev
      args:
        PHP_IMAGE: ${PHP_IMAGE}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE}
    volumes:
      - ./apps/api:/var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=180

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile.dev
      args:
        PHP_IMAGE: ${PHP_IMAGE}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE}
    volumes:
      - ./apps/api:/var/www/html

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    ports:
      - "3000:3000"
    command: sh -c "(test -d node_modules/next || npm install) && mkdir -p /app/.next/static/development && npm run dev"

  mailpit:
    image: ${MAILPIT_IMAGE}
    container_name: supportflow-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - private
      - public

volumes:
  web_node_modules:
  web_next_cache:
