openapi: 3.1.0
info:
  title: SupportFlow Audit and Analytics API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/owner/workspaces/{workspace}/audit-logs:
    get:
      summary: List workspace audit timeline entries (owner portal)
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/StartAt'
        - $ref: '#/components/parameters/EndAt'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Workspace audit timeline page
        '404':
          description: Workspace not found for current membership scope

  /api/owner/workspaces/{workspace}/tickets/{ticket}/audit-logs:
    get:
      summary: List ticket-specific audit timeline entries (owner portal)
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/TicketPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Ticket audit timeline page
        '404':
          description: Ticket not found in workspace scope

  /api/owner/workspaces/{workspace}/analytics/summary:
    get:
      summary: Retrieve workspace analytics summary (owner portal)
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/StartAt'
        - $ref: '#/components/parameters/EndAt'
      responses:
        '200':
          description: Workspace analytics summary
        '404':
          description: Workspace not found for current membership scope

  /api/admin/workspaces/{workspace}/audit-logs:
    get:
      summary: List workspace audit timeline entries (admin portal)
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/StartAt'
        - $ref: '#/components/parameters/EndAt'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Workspace audit timeline page
        '404':
          description: Workspace not found for current membership scope

  /api/admin/workspaces/{workspace}/tickets/{ticket}/audit-logs:
    get:
      summary: List ticket-specific audit timeline entries (admin portal)
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/TicketPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Ticket audit timeline page
        '404':
          description: Ticket not found in workspace scope

  /api/admin/workspaces/{workspace}/analytics/summary:
    get:
      summary: Retrieve workspace analytics summary (admin portal)
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/StartAt'
        - $ref: '#/components/parameters/EndAt'
      responses:
        '200':
          description: Workspace analytics summary
        '404':
          description: Workspace not found for current membership scope

  /api/staff/workspaces/{workspace}/audit-logs:
    get:
      summary: List workspace audit timeline entries (staff portal)
      description: Access is allowed for owner, admin, and viewer memberships; agent is denied.
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/StartAt'
        - $ref: '#/components/parameters/EndAt'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Workspace audit timeline page
        '403':
          description: Membership role lacks capability
        '404':
          description: Workspace not found for current membership scope

  /api/staff/workspaces/{workspace}/tickets/{ticket}/audit-logs:
    get:
      summary: List ticket-specific audit timeline entries (staff portal)
      description: Access is allowed for owner, admin, and viewer memberships; agent is denied.
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/TicketPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Ticket audit timeline page
        '403':
          description: Membership role lacks capability
        '404':
          description: Ticket not found in workspace scope

  /api/staff/workspaces/{workspace}/analytics/summary:
    get:
      summary: Retrieve workspace analytics summary (staff portal)
      description: Access is allowed for owner, admin, and viewer memberships; agent is denied.
      parameters:
        - $ref: '#/components/parameters/WorkspacePath'
        - $ref: '#/components/parameters/StartAt'
        - $ref: '#/components/parameters/EndAt'
      responses:
        '200':
          description: Workspace analytics summary
        '403':
          description: Membership role lacks capability
        '404':
          description: Workspace not found for current membership scope

components:
  parameters:
    WorkspacePath:
      name: workspace
      in: path
      required: true
      schema:
        type: integer

    TicketPath:
      name: ticket
      in: path
      required: true
      schema:
        type: integer

    StartAt:
      name: start_at
      in: query
      required: false
      schema:
        type: string
        format: date-time

    EndAt:
      name: end_at
      in: query
      required: false
      schema:
        type: string
        format: date-time

    Action:
      name: action
      in: query
      required: false
      schema:
        type: string

    ActorUserId:
      name: actor_user_id
      in: query
      required: false
      schema:
        type: integer

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1

    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100

  schemas:
    AuditLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AuditLogEntry:
      type: object
      required: [id, workspace_id, action, entity_type, entity_id, created_at]
      properties:
        id:
          type: integer
        workspace_id:
          type: integer
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: integer
        metadata:
          type: object
          additionalProperties: true
          description: Safe IDs and status context only; no sensitive payloads.
        created_at:
          type: string
          format: date-time

    AnalyticsSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AnalyticsSummary'

    AnalyticsSummary:
      type: object
      required:
        - workspace_id
        - window_start_at
        - window_end_at
        - total_tickets
        - tickets_needing_review
        - tickets_resolved
        - ai_runs_completed
        - ai_runs_failed_or_fallback
      properties:
        workspace_id:
          type: integer
        window_start_at:
          type: string
          format: date-time
        window_end_at:
          type: string
          format: date-time
        total_tickets:
          type: integer
        tickets_needing_review:
          type: integer
        tickets_resolved:
          type: integer
        ai_runs_completed:
          type: integer
        ai_runs_failed_or_fallback:
          type: integer

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
