; ─── SupportFlow Lite AI — PHP Production Settings ───────────────────────────

[PHP]
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On

memory_limit = 256M
max_execution_time = 180
max_input_time = 180
post_max_size = 20M
upload_max_filesize = 20M

; Timezone
date.timezone = UTC

; Expose no PHP version in headers
expose_php = Off
