; ─── SupportFlow Lite AI — PHP Development Settings ──────────────────────────

[PHP]
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 256M
max_execution_time = 300
max_input_time = 300
post_max_size = 20M
upload_max_filesize = 20M

; Timezone
date.timezone = UTC

; ─── Xdebug ──────────────────────────────────────────────────────────────────
[xdebug]
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
